<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول</title>
<style>
:root {
  --ink: #1c1f26;
  --paper: #f6f4ef;
  --card: #ffffff;
  --line: #e3ded2;
  --moss: #2f6b4f;
  --moss-dark: #234f3a;
  --clay: #b5503a;
  --muted: #6b6657;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 28px 24px;
  width: 100%;
  max-width: 360px;
  box-shadow: 0 1px 2px rgba(28,31,38,0.06);
}
h1 {
  font-size: 20px;
  color: var(--moss-dark);
  text-align: center;
  margin: 0 0 20px;
}
.field { margin-bottom: 14px; }
.field label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px; }
.field input {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  font-family: inherit;
  font-size: 14px;
  background: var(--paper);
}
.field input:focus { outline: 2px solid var(--moss); outline-offset: 1px; }
.btn {
  display: block;
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  background: var(--moss-dark);
  color: #fff;
  margin-top: 6px;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.msg {
  text-align: center;
  font-size: 13px;
  margin-top: 14px;
  padding: 10px;
  border-radius: 8px;
  display: none;
}
.msg.error { display: block; background: #fbeae6; color: var(--clay); }
.msg.info { display: block; background: #f4f1ea; color: var(--muted); }
</style>
</head>
<body>
<div class="card">
  <h1>تسجيل الدخول</h1>
  <div class="field">
    <label for="email">البريد الإلكتروني</label>
    <input type="email" id="email" autocomplete="username">
  </div>
  <div class="field">
    <label for="password">كلمة المرور</label>
    <input type="password" id="password" autocomplete="current-password">
  </div>
  <button class="btn" id="btnLogin">دخول</button>
  <div class="msg" id="msg"></div>
</div>

<script type="module">
import {
  auth, db, signInWithEmailAndPassword, doc, getDoc
} from './firebase-config.js';

const btn = document.getElementById('btnLogin');
const msg = document.getElementById('msg');

function showMsg(text, type) {
  msg.textContent = text;
  msg.className = 'msg ' + type;
}

btn.addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || !password) { showMsg('من فضلك اكتب البريد الإلكتروني وكلمة المرور', 'error'); return; }

  btn.disabled = true;
  btn.textContent = 'جاري الدخول...';

  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    const uid = cred.user.uid;

    const userDoc = await getDoc(doc(db, 'users', uid));
    if (!userDoc.exists()) {
      showMsg('الحساب دخل بنجاح لكن مفيش بيانات مرتبطة بيه', 'error');
      btn.disabled = false;
      btn.textContent = 'دخول';
      return;
    }

    const role = userDoc.data().role;
    if (role === 'superadmin') {
      window.location.href = 'superadmin.html';
    } else if (role === 'company_admin') {
      window.location.href = 'admin.html';
    } else if (role === 'employee') {
      window.location.href = 'employee.html';
    } else {
      showMsg('نوع الحساب غير معروف، تواصل مع المسؤول', 'error');
      btn.disabled = false;
      btn.textContent = 'دخول';
    }
  } catch (err) {
    let text = 'حدث خطأ، حاول مرة أخرى';
    if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
      text = 'البريد الإلكتروني أو كلمة المرور غير صحيحة';
    }
    showMsg(text, 'error');
    btn.disabled = false;
    btn.textContent = 'دخول';
  }
});
</script>
</body>
</html>
