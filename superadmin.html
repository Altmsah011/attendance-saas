<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة السوبر أدمن</title>
<style>
:root {
  --ink: #1c1f26;
  --paper: #f6f4ef;
  --card: #ffffff;
  --line: #e3ded2;
  --moss: #2f6b4f;
  --moss-dark: #234f3a;
  --clay: #b5503a;
  --amber: #b8842a;
  --muted: #6b6657;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  min-height: 100vh;
}
body { display: flex; flex-direction: column; align-items: center; padding: 20px 16px 40px; }
.wrap { width: 100%; max-width: 640px; }
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}
.topbar h1 { font-size: 19px; color: var(--moss-dark); margin: 0; }
.btn-logout {
  background: transparent;
  border: 1.5px solid var(--clay);
  color: var(--clay);
  padding: 7px 14px;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 1px 2px rgba(28,31,38,0.04);
}
.card h2 { font-size: 15px; margin: 0 0 14px; color: var(--moss-dark); }
.field { margin-bottom: 12px; }
.field label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px; }
.field input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  font-family: inherit;
  font-size: 14px;
  background: var(--paper);
}
.field input:focus { outline: 2px solid var(--moss); outline-offset: 1px; }
.btn {
  padding: 11px 18px;
  border-radius: 10px;
  border: none;
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  background: var(--moss-dark);
  color: #fff;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.company-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
}
.company-item:last-child { border-bottom: none; }
.company-item .name { font-weight: 700; font-size: 15px; }
.company-item .date { font-size: 12px; color: var(--muted); margin-top: 2px; }
.company-item .cid { font-size: 11px; color: var(--muted); font-family: monospace; margin-top: 2px; }
.empty-state { text-align: center; padding: 20px 10px; color: var(--muted); font-size: 14px; }
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: #fff;
  padding: 13px 20px;
  border-radius: 10px;
  font-size: 14px;
  max-width: 90%;
  text-align: center;
  opacity: 0;
  transition: all 0.25s ease;
  pointer-events: none;
  z-index: 999;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: var(--clay); }
.toast.success { background: var(--moss-dark); }
.gate { text-align: center; padding: 60px 10px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap" id="gateWrap">
  <div class="gate" id="gateMsg">جاري التحقق من الحساب...</div>
</div>

<div class="wrap hidden" id="app" style="display:none;">
  <div class="topbar">
    <h1>لوحة السوبر أدمن</h1>
    <button class="btn-logout" id="btnLogout">خروج</button>
  </div>

  <div class="card">
    <h2>إضافة شركة جديدة</h2>
    <div class="field">
      <label for="companyName">اسم الشركة</label>
      <input type="text" id="companyName" placeholder="مثال: شركة النور للتجارة">
    </div>
    <button class="btn" id="btnAddCompany">إضافة الشركة</button>
  </div>

  <div class="card">
    <h2>الشركات المسجلة</h2>
    <div id="companiesList"><div class="empty-state">جاري التحميل...</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import {
  auth, db, onAuthStateChanged, signOut,
  doc, getDoc, addDoc, collection, getDocs, query, orderBy, serverTimestamp
} from './firebase-config.js';

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => { t.className = 'toast ' + type; }, 3000);
}

function showGate(text) {
  document.getElementById('gateMsg').textContent = text;
  document.getElementById('gateWrap').style.display = 'block';
  document.getElementById('app').style.display = 'none';
}

// ===== حماية الصفحة: لازم يكون مسجل دخول وdoره superadmin =====
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = 'index.html';
    return;
  }

  try {
    const userDoc = await getDoc(doc(db, 'users', user.uid));
    if (!userDoc.exists() || userDoc.data().role !== 'superadmin') {
      showGate('الحساب ده مش سوبر أدمن، مفيش صلاحية دخول للصفحة دي');
      setTimeout(() => { window.location.href = 'index.html'; }, 2000);
      return;
    }

    document.getElementById('gateWrap').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadCompanies();
  } catch (err) {
    showGate('حصل خطأ أثناء التحقق من الحساب');
  }
});

document.getElementById('btnLogout').addEventListener('click', async () => {
  await signOut(auth);
  window.location.href = 'index.html';
});

// ===== إضافة شركة جديدة =====
document.getElementById('btnAddCompany').addEventListener('click', async () => {
  const nameInput = document.getElementById('companyName');
  const name = nameInput.value.trim();
  if (!name) { showToast('اكتب اسم الشركة الأول', 'error'); return; }

  const btn = document.getElementById('btnAddCompany');
  btn.disabled = true;
  btn.textContent = 'جاري الإضافة...';

  try {
    await addDoc(collection(db, 'companies'), {
      name: name,
      branches: [],
      leaveTypes: ['Annual', 'Sick', 'Emergency', 'Unpaid', 'Official'],
      telegramBotToken: '',
      createdAt: serverTimestamp()
    });
    nameInput.value = '';
    showToast('تمت إضافة الشركة بنجاح', 'success');
    loadCompanies();
  } catch (err) {
    showToast('حصل خطأ أثناء الإضافة', 'error');
  }

  btn.disabled = false;
  btn.textContent = 'إضافة الشركة';
});

// ===== عرض الشركات =====
async function loadCompanies() {
  const listEl = document.getElementById('companiesList');
  try {
    const q = query(collection(db, 'companies'), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);

    if (snap.empty) {
      listEl.innerHTML = '<div class="empty-state">لا توجد شركات مسجلة بعد</div>';
      return;
    }

    let html = '';
    snap.forEach((docSnap) => {
      const data = docSnap.data();
      const dateStr = data.createdAt && data.createdAt.toDate
        ? data.createdAt.toDate().toLocaleDateString('ar-EG')
        : '—';
      html += `<div class="company-item">
        <div>
          <div class="name">${escapeHtml(data.name)}</div>
          <div class="date">أُضيفت في ${dateStr}</div>
          <div class="cid">${docSnap.id}</div>
        </div>
      </div>`;
    });
    listEl.innerHTML = html;
  } catch (err) {
    listEl.innerHTML = '<div class="empty-state">تعذر تحميل قائمة الشركات</div>';
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
